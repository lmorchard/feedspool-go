name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  ci:
    name: CI (Lint, Test)
    runs-on: ubuntu-latest
    steps:
    - name: Check if CI should be skipped
      id: skip_check
      env:
        HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        if [[ "$HEAD_COMMIT_MESSAGE" == "[noci]"* ]]; then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "CI skipped due to [noci] in commit message"
        else
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Running full CI pipeline"
        fi

    - name: Checkout
      if: steps.skip_check.outputs.skip != 'true'
      uses: actions/checkout@v4

    - name: Set up Go
      if: steps.skip_check.outputs.skip != 'true'
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Download dependencies
      if: steps.skip_check.outputs.skip != 'true'
      run: go mod download

    # Read the pin from the Makefile so local `make lint` and CI cannot drift
    # onto different versions and disagree about what counts as a finding.
    - name: Determine golangci-lint version
      id: lint_version
      if: steps.skip_check.outputs.skip != 'true'
      run: echo "version=$(make print-golangci-lint-version)" >> "$GITHUB_OUTPUT"

    - name: Run golangci-lint
      if: steps.skip_check.outputs.skip != 'true'
      uses: golangci/golangci-lint-action@v8
      with:
        version: ${{ steps.lint_version.outputs.version }}
        args: --timeout=5m

    - name: Run tests
      if: steps.skip_check.outputs.skip != 'true'
      run: go test -v -race ./...

