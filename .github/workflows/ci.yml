name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  ci:
    name: CI (Lint, Test)
    runs-on: ubuntu-latest
    steps:
    - name: Check if CI should be skipped
      id: skip_check
      env:
        HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        if [[ "$HEAD_COMMIT_MESSAGE" == "[noci]"* ]]; then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "CI skipped due to [noci] in commit message"
        else
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Running full CI pipeline"
        fi

    - name: Checkout
      if: steps.skip_check.outputs.skip != 'true'
      uses: actions/checkout@v4

    # Read the pin out of go.mod so CI installs exactly the Go that `make lint`
    # runs on. setup-go@v5 resolves `go-version-file: go.mod` from the `go`
    # directive rather than the `toolchain` one, so that route installs 1.25.0
    # and leaves GOTOOLCHAIN=auto to download the pinned toolchain on every
    # job. This lands on it directly instead.
    - name: Determine Go version
      id: go_version
      if: steps.skip_check.outputs.skip != 'true'
      run: echo "version=$(make print-go-version | sed 's/^go//')" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      if: steps.skip_check.outputs.skip != 'true'
      uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.go_version.outputs.version }}

    # The step above installs the pin explicitly, so this should always hold.
    # Asserting it anyway means a broken pin says so in one named step, instead
    # of CI quietly linting against a different stdlib than `make lint` does --
    # which is the failure #67 was.
    - name: Verify the Go toolchain matches the pin
      if: steps.skip_check.outputs.skip != 'true'
      run: make check-toolchain

    - name: Download dependencies
      if: steps.skip_check.outputs.skip != 'true'
      run: go mod download

    # Read the pin from the Makefile so local `make lint` and CI cannot drift
    # onto different versions and disagree about what counts as a finding.
    - name: Determine golangci-lint version
      id: lint_version
      if: steps.skip_check.outputs.skip != 'true'
      run: echo "version=$(make print-golangci-lint-version)" >> "$GITHUB_OUTPUT"

    # Cache the linter binary rather than rebuilding it on every run. The key
    # carries both pins, because the binary is a product of both: bumping either
    # GOLANGCI_LINT_VERSION or the Go toolchain has to yield a fresh binary
    # rather than reuse one built against the other version. That is the #67
    # mismatch in cache form, and an exact key with no restore-keys is what
    # keeps it from being restored across a bump.
    - name: Cache the golangci-lint binary
      if: steps.skip_check.outputs.skip != 'true'
      uses: actions/cache@v4
      with:
        path: bin
        key: golangci-lint-${{ runner.os }}-${{ steps.lint_version.outputs.version }}-go${{ steps.go_version.outputs.version }}

    # `make lint` rather than golangci-lint-action: the action fetches a
    # prebuilt binary while `make lint` builds one from source with the pinned
    # toolchain, which was the last remaining difference between what CI checks
    # and what you can reproduce locally. Same target, same pins, same
    # provenance, same flags -- and `make lint` prints both versions it used.
    - name: Run golangci-lint
      if: steps.skip_check.outputs.skip != 'true'
      run: make lint

    - name: Run tests
      if: steps.skip_check.outputs.skip != 'true'
      run: go test -v -race ./...

