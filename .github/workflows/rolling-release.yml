name: Rolling Release

# This workflow runs CI checks once as a quality gate, then builds release artifacts
# and Docker images. Docker images are built on the same Linux AMD64 runner that 
# compiles the binary, eliminating the need for artifact downloads.

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  # Run CI checks first (lint, test) before building release
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest  
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Set version variables
      shell: bash
      run: |
        echo "VERSION=latest" >> $GITHUB_ENV
        echo "COMMIT=${GITHUB_SHA::7}" >> $GITHUB_ENV
        echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        VERSION: ${{ env.VERSION }}
        COMMIT: ${{ env.COMMIT }}
        DATE: ${{ env.DATE }}
      shell: bash
      run: |
        # One build command for every target: the sqlite driver is pure Go, so
        # there is no cgo, no target C toolchain, and the Linux binary is
        # statically linked for Alpine. CGO_ENABLED=0 is set by the Makefile.
        make build

        # Rename to expected output for Windows
        if [ "$GOOS" = "windows" ] && [ -f feedspool ]; then
          mv feedspool feedspool.exe
        fi

    # Build Docker image BEFORE creating archives (Linux AMD64 only)
    - name: Verify binary for Docker build
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: |
        echo "Files in current directory:"
        ls -la
        echo "Checking for feedspool binary:"
        if [ -f feedspool ]; then
          echo "✓ feedspool binary found"
          file feedspool
          ./feedspool version || echo "Binary test failed"
        else
          echo "✗ feedspool binary NOT found"
          exit 1
        fi

    # buildx names the binary it copies by TARGETARCH, so stage one per target.
    - name: Stage per-arch binaries for the multi-arch image
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: |
        set -euo pipefail
        # This job already built linux/amd64 for the release archive.
        cp feedspool feedspool-linux-amd64
        # Cross-compiling costs nothing now that cgo is disabled.
        GOOS=linux GOARCH=arm64 make build BINARY=feedspool-linux-arm64

        # Assert each binary really is the architecture its filename claims.
        # This has to happen here rather than inside the image: a RUN step
        # cannot tell, because binfmt/qemu will transparently execute a
        # foreign-arch binary and report success.
        assert_arch() {
          actual=$(file -b "$1")
          case "$actual" in
            *"$2"*) echo "ok: $1 is $2" ;;
            *) echo "::error::$1 should be $2 but is: $actual"; exit 1 ;;
          esac
        }
        assert_arch feedspool-linux-amd64 x86-64
        assert_arch feedspool-linux-arm64 aarch64

    # Needed to run the arm64 image's RUN layers (apk, the binary smoke test)
    # on an amd64 runner.
    - name: Set up QEMU
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract Docker metadata
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: lmorchard/feedspool
        tags: |
          # Latest tag for rolling releases
          type=raw,value=latest
        labels: |
          org.opencontainers.image.title=feedspool
          org.opencontainers.image.description=RSS/Atom feed aggregator and static site generator
          org.opencontainers.image.vendor=lmorchard

    - name: Build and push Docker image
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.prebuilt
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create archive (Unix)
      if: matrix.goos != 'windows'
      shell: bash
      run: |
        archive_name="feedspool_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
        tar -czf "${archive_name}.tar.gz" "feedspool"
        echo "ARCHIVE=${archive_name}.tar.gz" >> $GITHUB_ENV

    - name: Create archive (Windows)
      if: matrix.goos == 'windows'
      shell: powershell
      run: |
        $archive_name = "feedspool_$($env:VERSION)_${{ matrix.goos }}_${{ matrix.goarch }}"
        Compress-Archive -Path "feedspool.exe" -DestinationPath "${archive_name}.zip"
        echo "ARCHIVE=${archive_name}.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARCHIVE }}
        path: ${{ env.ARCHIVE }}

  release:
    name: Create Rolling Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Generate checksums
      run: |
        cd dist
        sha256sum * > checksums.txt

    - name: Delete existing latest tag and release
      run: |
        # Delete the release if it exists (with --cleanup-tag to delete the tag too)
        # We do this first so the release doesn't become an orphaned draft
        gh release delete latest --yes --cleanup-tag || true
        
        # Delete the tag locally and remotely if it exists
        git tag -d latest || true
        git push origin :refs/tags/latest || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create new latest tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag latest
        git push origin latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Rolling Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Latest Development Build"
        body: |
          **⚠️ This is a pre-release development build ⚠️**
          
          This is an automated rolling release built from the latest commit on the main branch.
          
          **Commit:** ${{ github.sha }}
          **Build Date:** ${{ github.run_started_at }}
          
          This build may be unstable and is intended for testing purposes only.
          For stable releases, please use the numbered version releases.
        files: dist/*
        draft: false
        prerelease: true
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}