version: "2"
run:
  tests: true
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - copyloopvar
    - cyclop
    - dupl
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - godot
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - lll
    - makezero
    - misspell
    - mnd
    - nakedret
    - nestif
    - nilerr
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - testpackage
    - tparallel
    - unconvert
    - unparam
    - usetesting
    - wastedassign
    - whitespace
  disable:
    - nilnil
  settings:
    cyclop:
      max-complexity: 15
      package-average: 10
    dupl:
      threshold: 100
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - whyNoLint
        - wrapperFunc
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    lll:
      line-length: 120
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "8"
        - "10"
        - "16"
        - "32"
        - "60"
        - "64"
        - "100"
        - "256"
        - "404"
        - "500"
        - "503"
        - "1024"
      ignored-functions:
        - make
    nolintlint:
      require-explanation: false
      require-specific: false
      allow-unused: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - funlen
          - gocognit
          - gocyclo
          - gosec
          - lll
        path: _test\.go
      - linters:
          - mnd
        text: 'Magic number: 3'
      - linters:
          - gochecknoglobals
        path: cmd/
      - linters:
          - gochecknoinits
        path: cmd/
      - linters:
          - forbidigo
        path: cmd/(fetch|show|purge|export|reindex|render|serve|subscribe|unsubscribe|version)\.go
      - linters:
          - nestif
        path: cmd/(fetch|purge|render|root)\.go
      - linters:
          - nestif
        path: internal/initialize/initialize\.go
      - linters:
          - cyclop
          - gocognit
        path: _test\.go
      - linters:
          - testpackage
        path: _test\.go
      - linters:
          - unparam
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
